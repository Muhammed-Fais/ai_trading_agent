data:
  train_csv: data/xauusd_m15.csv
  timestamp_column: timestamp
  timezone: UTC

features:
  horizon_bars: 4
  threshold_bps: 8.0
  min_rows: 500

validation:
  splits: 5
  embargo_bars: 4

model:
  artifact_path: artifacts/xauusd_ensemble.joblib
  random_state: 42
  min_confidence: 0.56

backtest:
  initial_equity: 10000.0
  risk_per_trade: 0.005
  spread_bps: 3.0
  slippage_bps: 1.0
  max_position_notional: 50000.0

