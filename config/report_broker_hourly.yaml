data:
  train_csv: data/xauusd_broker_1h.csv
  timestamp_column: timestamp
  timezone: UTC

features:
  horizon_bars: 4
  threshold_bps: 10.0
  min_rows: 3000

validation:
  splits: 5
  embargo_bars: 8

model:
  artifact_path: artifacts/xauusd_broker_hourly_ensemble.joblib
  random_state: 42
  min_confidence: 0.42

backtest:
  initial_equity: 10000.0
  risk_per_trade: 0.003
  spread_bps: 3.0
  slippage_bps: 1.0
  max_position_notional: 30000.0

strategy:
  max_hold_bars: 16
  stop_atr_multiple: 2.0
  take_profit_atr_multiple: 3.0
  allow_overlapping_trades: false
